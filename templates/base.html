<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Chemical Physics Roadmap{% endblock %} — Jonas Choi</title>
  <link rel="stylesheet" href="{{ static_prefix }}static/style.css">
  <script>
    // Runs before paint so a night-mode viewer never sees a flash of the light theme.
    // No stored choice means no attribute, which leaves the OS preference in charge.
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || t === 'light') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="site">
    <div class="wrap">
      <div class="row">
        <div>
          <a class="title" href="{{ static_prefix }}index.html">Chemical Physics Roadmap</a>
          <span class="subtitle">Columbia College · Chemical Physics</span>
        </div>
        <nav>
          <a href="{{ static_prefix }}index.html" {% if active_page == 'about' %}class="active"{% endif %}>About</a>
          <a href="{{ static_prefix }}dashboard.html" {% if active_page == 'dashboard' %}class="active"{% endif %}>Dashboard</a>
          <a href="{{ static_prefix }}courses.html" {% if active_page == 'courses' %}class="active"{% endif %}>Courses</a>
          <a href="{{ static_prefix }}registration.html" {% if active_page == 'registration' %}class="active"{% endif %}>Registration</a>
          <a href="{{ static_prefix }}projects.html" {% if active_page == 'projects' %}class="active"{% endif %}>Projects</a>
          <a href="{{ static_prefix }}professors.html" {% if active_page == 'professors' %}class="active"{% endif %}>Professors</a>
          <a href="{{ static_prefix }}research.html" {% if active_page == 'research' %}class="active"{% endif %}>Research</a>
          <a href="{{ static_prefix }}internships.html" {% if active_page == 'internships' %}class="active"{% endif %}>Opportunities</a>
          <button class="theme-toggle" type="button" aria-label="Switch colour theme">☾</button>
        </nav>
      </div>
    </div>
  </header>

  <main>
    <div class="wrap">
      {% block content %}{% endblock %}
    </div>
  </main>

  <footer class="site">
    <div class="wrap">
      Jonas Choi &middot; Columbia University &middot; Built {{ today_str }}
    </div>
  </footer>
  <script>
    (function () {
      var root = document.documentElement;
      var btn = document.querySelector('.theme-toggle');
      if (!btn) return;
      var mq = window.matchMedia('(prefers-color-scheme: dark)');

      function current() {
        return root.getAttribute('data-theme') || (mq.matches ? 'dark' : 'light');
      }

      function label(theme) {
        var toDark = theme !== 'dark';
        btn.textContent = toDark ? '\u263E' : '\u2600';
        btn.setAttribute('aria-label', toDark ? 'Switch to night mode' : 'Switch to day mode');
        btn.title = btn.getAttribute('aria-label');
      }

      label(current());

      btn.addEventListener('click', function () {
        var next = current() === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
        label(next);
      });

      // While the viewer has made no choice here, keep following the OS.
      mq.addEventListener('change', function (e) {
        if (!root.getAttribute('data-theme')) label(e.matches ? 'dark' : 'light');
      });
    })();
  </script>
</body>
</html>
